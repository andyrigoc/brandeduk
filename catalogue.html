<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Catalogue - Branded UK</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #f8fafc;
            overflow-x: hidden;
        }
        

        
        /* Catalogue Container - wrapper to hide iframe scrollbar */
        .catalogue-container {
            width: 100%;
            height: calc(100vh - 44px);
            overflow: hidden;
            position: relative;
        }
        .catalogue-container iframe {
            display: block;
            width: 100%;
            height: calc(100% + 20px); /* Extra height to push scrollbar below visible area */
            border: none;
        }
        
        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            color: #273469;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .back-link:hover { color: #E4D9FF; }
    </style>
</head>
<body>



<a href="home-pc.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back to Home
</a>

<div class="catalogue-container">
    <iframe src="https://brandeduk.fullcollection.com" title="BrandedUK catalogue"></iframe>
</div>

<script src="brandedukv15-child/assets/js/tawk-inline.js"></script>
<!--Start of Tawk.to Script-->
<script type="text/javascript">
(function(){
    var host = window.location.hostname;
    // Tawk often blocks localhost; avoid noisy console errors during local dev.
    // Use ?tawk=1 (or ?chat=1) to force-enable locally when needed.
    var allowLocal = false;
    try {
        var params = new URLSearchParams(window.location.search);
        allowLocal = params.has('tawk') || params.has('chat');
    } catch (e) {
        allowLocal = false;
    }
    if (!allowLocal && (host === 'localhost' || host === '127.0.0.1')) return;

    var propertyId = '69628dafb346e51985794182';
    var widgetId = '1jekfitse';

    // If you create a separate Tawk property for staging, set it here:
    // if (host.endsWith('.vercel.app')) { propertyId = '...'; widgetId = '...'; }

    window.Tawk_API = window.Tawk_API || {};
    // Hide default bubble; open only from our in-site trigger.
    window.Tawk_API.onLoad = function () {
        try { if (window.Tawk_API && typeof window.Tawk_API.hideWidget === 'function') window.Tawk_API.hideWidget(); } catch (e) {}
    };
    window.Tawk_API.onChatMinimized = function () {
        try { if (window.Tawk_API && typeof window.Tawk_API.hideWidget === 'function') window.Tawk_API.hideWidget(); } catch (e) {}
    };
    window.Tawk_LoadStart = new Date();

    var s1 = document.createElement('script');
    var s0 = document.getElementsByTagName('script')[0];
    s1.async = true;
    s1.src = 'https://embed.tawk.to/' + propertyId + '/' + widgetId;
    s1.charset = 'UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1, s0);
})();
</script>
<!--End of Tawk.to Script-->

<style>
/* Hide the Tawk launcher bubble by default (only show when user opens chat). */
body:not(.tawk-open) iframe[title="chat widget"],
body:not(.tawk-open) .tawk-min-container,
body:not(.tawk-open) #tawk-bubble-container {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: translateY(120px) !important;
}
body.tawk-open iframe[title="chat widget"],
body.tawk-open .tawk-min-container,
body.tawk-open #tawk-bubble-container {
    opacity: 1 !important;
    pointer-events: auto !important;
    transform: none !important;
}

@media (max-width: 1023px) {
    iframe[title="chat widget"],
    .tawk-min-container,
    #tawk-bubble-container {
        bottom: 75px !important;
    }
}
</style>

</body>
</html>
