<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in - BrandedUK</title>
    <style>
        :root { --navy:#273469; --orange:#f97316; --border:#e5e7eb; --grey:#6b7280; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f4f5f7; font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--navy); }
        main { width:min(100%,480px); background:#fff; border:1px solid var(--border); border-radius:12px; padding:30px 24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.08); }
        h1 { margin:0 0 10px; font-size:26px; }
        p { margin:0; color:var(--grey); line-height:1.55; }
        .spinner { width:42px; height:42px; border:4px solid #fed7aa; border-top-color:var(--orange); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
        .error { color:#dc2626; margin-top:14px; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <main>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Signing you in</h1>
        <p id="authStatus">Connecting your account and returning to checkout...</p>
        <p class="error" id="authError" style="display:none"></p>
    </main>

    <script>
        (function () {
            var API_BASE_URL = (window.API_BASE_URL || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3004' : 'https://api.brandeduk.com')).replace(/\/+$/, '');
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var next = params.get('next') || localStorage.getItem('authReturnTo') || '/checkout';
            var errorEl = document.getElementById('authError');
            var statusEl = document.getElementById('authStatus');

            function showError(message) {
                statusEl.textContent = 'We could not complete sign in.';
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                setTimeout(function () { window.location.replace('/checkout'); }, 2200);
            }

            if (!token) {
                showError('Missing login token. Returning to checkout.');
                return;
            }

            try {
                localStorage.setItem('authToken', token);
                localStorage.setItem('coAuthToken', token);
                document.cookie = 'authToken=' + encodeURIComponent(token) + '; Path=/; SameSite=Lax; Max-Age=2592000';
            } catch (e) {}

            fetch(API_BASE_URL + '/api/auth/me', {
                headers: { Authorization: 'Bearer ' + token }
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('Unable to load account');
                    return res.json();
                })
                .then(function (data) {
                    var user = data.user || data.data || data;
                    localStorage.setItem('coUser', JSON.stringify(user));
                    localStorage.setItem('authUser', JSON.stringify(user));
                    localStorage.removeItem('authReturnTo');
                    window.location.replace(next);
                })
                .catch(function (err) {
                    showError(err.message || 'Unable to load account. Returning to checkout.');
                });
        })();
    </script>
</body>
</html>
