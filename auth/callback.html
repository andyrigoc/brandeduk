<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in - BrandedUK</title>
    <style>
        :root {
            --navy:#273469;
            --orange:#f97316;
            --orange-dark:#c2410c;
            --line:#dfe4ee;
            --muted:#657086;
            --soft:#f6f8fb;
        }
        * { box-sizing:border-box; }
        body {
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:24px;
            background:
                radial-gradient(circle at top left, rgba(249,115,22,.16), transparent 32rem),
                linear-gradient(180deg, #fbfcff 0%, #eef2f7 100%);
            font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color:var(--navy);
        }
        main {
            width:min(100%, 520px);
            border:1px solid rgba(39,52,105,.12);
            border-radius:28px;
            padding:34px 28px;
            background:rgba(255,255,255,.92);
            text-align:center;
            box-shadow:0 24px 70px rgba(39,52,105,.12);
        }
        .mark {
            width:72px;
            height:72px;
            margin:0 auto 20px;
            display:grid;
            place-items:center;
            border-radius:24px;
            background:#fff7ed;
            color:var(--orange);
            position:relative;
        }
        .mark:before {
            content:"";
            width:54px;
            height:54px;
            position:absolute;
            border:3px solid rgba(249,115,22,.22);
            border-top-color:var(--orange);
            border-radius:999px;
            animation:spin .85s linear infinite;
        }
        .mark span { position:relative; font-size:24px; font-weight:900; }
        h1 { margin:0; color:var(--navy); font-size:30px; letter-spacing:-.04em; }
        p { margin:12px 0 0; color:var(--muted); line-height:1.6; }
        .steps {
            display:grid;
            gap:10px;
            margin-top:24px;
            text-align:left;
        }
        .step {
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 14px;
            border:1px solid var(--line);
            border-radius:16px;
            background:var(--soft);
            color:var(--muted);
            font-size:14px;
        }
        .step.is-active { background:#fff7ed; color:var(--orange-dark); border-color:#fed7aa; font-weight:800; }
        .dot { width:9px; height:9px; border-radius:999px; background:currentColor; flex:none; }
        .error { display:none; margin-top:16px; color:#b91c1c; font-weight:800; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true"><span>BU</span></div>
        <h1>Signing you in securely</h1>
        <p id="authStatus">Hold tight. We are connecting your Google account and will return you to the page you came from.</p>
        <div class="steps" aria-label="Sign in progress">
            <div class="step is-active" id="stepToken"><span class="dot"></span><span>Checking your sign-in token</span></div>
            <div class="step" id="stepProfile"><span class="dot"></span><span>Loading your BrandedUK profile</span></div>
            <div class="step" id="stepReturn"><span class="dot"></span><span>Taking you back to the store</span></div>
        </div>
        <p class="error" id="authError"></p>
    </main>

    <script src="../brandedukv15-child/assets/js/api-config.js?v=20260530"></script>
    <script>
        (function () {
            var API_BASE_URL = (typeof window.resolveBrandedApiBase === 'function'
                ? window.resolveBrandedApiBase()
                : (window.API_BASE_URL || 'https://api.brandeduk.com')).replace(/\/+$/, '');
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var defaultNext = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                ? '/home-pc.html'
                : '/';
            var next = sanitizeNext(params.get('next') || localStorage.getItem('authReturnTo') || defaultNext);
            var errorEl = document.getElementById('authError');
            var statusEl = document.getElementById('authStatus');

            function sanitizeNext(value) {
                if (!value) return defaultNext;
                try {
                    var url = new URL(value, window.location.origin);
                    if (url.origin !== window.location.origin) return defaultNext;
                    url.searchParams.delete('token');
                    return url.pathname + url.search + url.hash;
                } catch (e) {
                    return defaultNext;
                }
            }

            function setActive(id, message) {
                Array.prototype.forEach.call(document.querySelectorAll('.step'), function (step) {
                    step.classList.remove('is-active');
                });
                var step = document.getElementById(id);
                if (step) step.classList.add('is-active');
                if (message) statusEl.textContent = message;
            }

            function showError(message) {
                statusEl.textContent = 'We could not complete sign in.';
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                setTimeout(function () { window.location.replace(next || defaultNext); }, 2400);
            }

            if (!token) {
                showError('Missing login token. Please try signing in again.');
                return;
            }

            try {
                localStorage.setItem('authToken', token);
                localStorage.setItem('coAuthToken', token);
                document.cookie = 'authToken=' + encodeURIComponent(token) + '; Path=/; SameSite=Lax; Max-Age=2592000';
            } catch (e) {}

            setActive('stepProfile', 'Great, Google approved the sign-in. We are loading your account now.');

            fetch(API_BASE_URL + '/api/auth/me', {
                headers: { Authorization: 'Bearer ' + token }
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('Unable to load account');
                    return res.json();
                })
                .then(function (data) {
                    var user = data.user || data.data || data;
                    localStorage.setItem('coUser', JSON.stringify(user));
                    localStorage.setItem('authUser', JSON.stringify(user));
                    localStorage.removeItem('authReturnTo');
                    try { sessionStorage.setItem('authJustSignedIn', '1'); } catch (e) {}
                    setActive('stepReturn', 'You are signed in. Returning you to the store now.');
                    setTimeout(function () {
                        window.location.replace(next);
                    }, 650);
                })
                .catch(function (err) {
                    showError(err.message || 'Unable to load account. Please try again.');
                });
        })();
    </script>
</body>
</html>
