<!DOCTYPE html>
<html lang="en-GB">
<head>
  <script>
    (function () {
      var target = '/index.html' + window.location.search + window.location.hash;
      window.location.replace(target);
    }());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101a3c">
  <meta name="build-version" content="desktop-fullscreen-20260803b">
  <title>Desktop Site Coming Soon | BrandedUK</title>
  <style>
    :root {
      --navy: #101a3c;
      --navy-soft: #1a2858;
      --purple: #a936b3;
      --purple-light: #dd78e4;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--white);
      background:
        radial-gradient(circle at 50% -15%, rgba(209, 88, 216, 0.34), transparent 34rem),
        radial-gradient(circle at 12% 82%, rgba(105, 65, 173, 0.22), transparent 28rem),
        linear-gradient(145deg, var(--navy-soft), var(--navy) 58%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1180px);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: clamp(26px, 4vw, 46px) clamp(22px, 5vw, 64px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      align-self: center;
      gap: 10px;
      color: var(--white);
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.045em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 2px solid var(--purple-light);
      border-radius: 50%;
      color: var(--purple-light);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -0.08em;
    }

    .hero {
      width: min(100%, 760px);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 54px 0 64px;
      text-align: center;
    }

    .visual {
      position: relative;
      width: 116px;
      height: 116px;
      display: grid;
      place-items: center;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 34px;
      color: var(--white);
      background: linear-gradient(145deg, rgba(222, 117, 229, 0.32), rgba(169, 54, 179, 0.13));
      box-shadow: 0 22px 60px rgba(5, 10, 31, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .visual::after {
      content: "";
      position: absolute;
      width: 156px;
      height: 156px;
      border: 1px solid rgba(222, 117, 229, 0.13);
      border-radius: 48px;
      transform: rotate(9deg);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--purple-light);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(44px, 6vw, 74px);
      line-height: 1.02;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .message {
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.55;
    }

    .mobile-prompt {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 34px;
      padding: 13px 20px 13px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 14px 36px rgba(4, 9, 29, 0.18);
      text-align: left;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .mobile-prompt-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--white);
      background: linear-gradient(145deg, var(--purple-light), var(--purple));
    }

    .mobile-prompt small {
      display: block;
      margin-bottom: 2px;
      color: rgba(255, 255, 255, 0.56);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mobile-prompt strong {
      font-size: 16px;
      font-weight: 750;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 20px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .contact span {
      color: rgba(255, 255, 255, 0.5);
    }

    .contact a {
      color: rgba(255, 255, 255, 0.86);
      font-weight: 650;
      text-decoration: none;
    }

    .contact a:hover,
    .contact a:focus-visible {
      color: var(--purple-light);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-height: 680px) {
      .hero {
        padding: 34px 0 42px;
      }

      .visual {
        width: 90px;
        height: 90px;
        margin-bottom: 22px;
        border-radius: 28px;
      }

      .visual::after {
        width: 120px;
        height: 120px;
        border-radius: 38px;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-inline: 20px;
      }

      .hero {
        padding-block: 42px 52px;
      }

      .mobile-prompt {
        width: min(100%, 330px);
      }

      .contact {
        flex-direction: column;
        padding-bottom: 4px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero > * {
        animation: enter 480ms ease-out both;
      }

      .hero > :nth-child(2) { animation-delay: 50ms; }
      .hero > :nth-child(3) { animation-delay: 90ms; }
      .hero > :nth-child(4) { animation-delay: 130ms; }
      .hero > :nth-child(5) { animation-delay: 170ms; }

      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <div class="brand" aria-label="BrandedUK">
      <span class="brand-mark" aria-hidden="true">bd</span>
      <span>brandeduk</span>
    </div>

    <section class="hero">
      <div class="visual" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect>
          <path d="M10 5h4M11.7 18.5h.6"></path>
        </svg>
      </div>

      <p class="eyebrow">Desktop experience</p>
      <h1 id="page-title">Our desktop site is coming soon.</h1>
      <p class="message">Continue shopping and customising on your mobile.</p>

      <div class="mobile-prompt" aria-label="Open BrandedUK on your mobile phone">
        <span class="mobile-prompt-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect>
            <path d="M10 5h4M11.8 18.5h.4"></path>
          </svg>
        </span>
        <span>
          <small>Open on your phone</small>
          <strong>brandeduk.com</strong>
        </span>
      </div>
    </section>

    <footer class="contact">
      <span>Need help?</span>
      <a href="mailto:info@brandeduk.com">info@brandeduk.com</a>
      <a href="tel:+442089742722">0208 974 2722</a>
    </footer>
  </main>
</body>
</html>
