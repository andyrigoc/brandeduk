<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5fa">
  <title>Desktop Site Coming Soon | BrandedUK</title>
  <style>
    :root {
      --navy: #172554;
      --plum: #8e2a91;
      --purple: #b33ec0;
      --muted: #667085;
      --line: #e8e4ec;
      --soft: #f8f5fa;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--navy);
      background:
        radial-gradient(circle at 50% 0%, rgba(179, 62, 192, 0.11), transparent 34rem),
        #f7f8fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .notice {
      width: min(100%, 640px);
      padding: clamp(38px, 6vw, 64px);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 70px rgba(23, 37, 84, 0.1);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      color: var(--plum);
      font-size: 27px;
      font-weight: 750;
      letter-spacing: -0.045em;
    }

    .brand-mark {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -0.08em;
    }

    .phone-mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 20px;
      color: var(--plum);
      background: #f6eaf7;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--plum);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 500px;
      margin: 0 auto;
      font-size: clamp(36px, 5vw, 52px);
      line-height: 1.06;
      letter-spacing: -0.045em;
    }

    .message {
      max-width: 490px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.6;
    }

    .message strong {
      color: var(--navy);
      font-weight: 750;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .contact span {
      color: #8a8f9d;
    }

    .contact a {
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
    }

    .contact a:hover,
    .contact a:focus-visible {
      color: var(--plum);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: var(--white);
      }

      .notice {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .brand {
        margin-bottom: 34px;
      }

      .contact {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .notice {
        animation: enter 420ms ease-out both;
      }

      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="notice" aria-labelledby="page-title">
    <div class="brand" aria-label="BrandedUK">
      <span class="brand-mark" aria-hidden="true">bd</span>
      <span>brandeduk</span>
    </div>

    <div class="phone-mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect>
        <path d="M10 5h4M11.7 18.5h.6"></path>
      </svg>
    </div>

    <p class="eyebrow">Desktop version coming soon</p>
    <h1 id="page-title">We’re almost ready.</h1>
    <p class="message">
      For now, open <strong>brandeduk.com</strong> on your mobile to shop and customise.
    </p>

    <footer class="contact">
      <span>Need help?</span>
      <a href="mailto:info@brandeduk.com">info@brandeduk.com</a>
      <a href="tel:+442089742722">0208 974 2722</a>
    </footer>
  </main>
</body>
</html>
