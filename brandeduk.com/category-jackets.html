<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Desktop experience gate: keep this first so desktop visitors never see the live site. -->
    <script data-desktop-experience-gate>
        (function (d) {
            var path = window.location.pathname.replace(/\\/g, '/');
            var mountAt = path.toLowerCase().indexOf('/brandeduk/');
            var localHost = /^(?:localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.|172\.(?:1[6-9]|2\d|3[01])\.)/i.test(window.location.hostname);
            var base = mountAt !== -1 && (window.location.protocol === 'file:' || localHost)
                ? path.slice(0, mountAt + '/brandeduk'.length)
                : '';
            d.write('<script src="' + base + '/desktop-gate.js?v=20260803a"><\/script>');
        }(document));
    </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jackets</title>
  <meta http-equiv="refresh" content="0; url=shop-pc.html?category=jackets&demo=1" />
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const force = (params.get('force') || '').toLowerCase();
      const isMobile = window.innerWidth < 1024;

      if (force === 'mobile' || (force !== 'desktop' && isMobile)) {
        window.location.replace('../category-jackets.html?force=mobile');
        return;
      }

      window.location.replace('shop-pc.html?category=jackets&demo=1');
    })();
  </script>
</head>
