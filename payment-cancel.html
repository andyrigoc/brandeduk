<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - BrandedUK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="brandedukv15-child/assets/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --navy: #273469;
            --orange: #f97316;
            --border: #e5e7eb;
            --grey: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f5f7;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--navy);
        }
        main {
            width: min(100%, 520px);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            background: #fff7ed;
            color: var(--orange);
            border: 1px solid #fed7aa;
            font-size: 34px;
            font-weight: 800;
        }
        h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.15; }
        p { margin: 0 auto 18px; color: var(--grey); line-height: 1.6; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
        }
        .primary { background: var(--orange); color: #fff; }
        .secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
    </style>
</head>
<body>
    <main>
        <div class="icon">!</div>
        <h1>Payment Cancelled</h1>
        <p>No payment was taken. Your basket is still saved, so you can return to checkout when you are ready.</p>
        <div class="actions">
            <a class="primary" href="/checkout">Return to Checkout</a>
            <a class="secondary" href="/basket">View Basket</a>
        </div>
    </main>
</body>
</html>
