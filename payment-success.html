<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - BrandedUK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="brandedukv15-child/assets/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --navy: #273469;
            --orange: #f97316;
            --green: #22c55e;
            --border: #e5e7eb;
            --grey: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f5f7;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--navy);
        }
        main {
            width: min(100%, 520px);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            background: var(--green);
            color: #fff;
            font-size: 34px;
            font-weight: 800;
        }
        h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.15; }
        p { margin: 0 auto 18px; color: var(--grey); line-height: 1.6; }
        .session {
            display: none;
            margin: 18px 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            color: var(--grey);
            font-size: 12px;
            word-break: break-all;
        }
        a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 8px;
            background: var(--orange);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon">✓</div>
        <h1>Payment Successful</h1>
        <p>Your payment has been received. We will confirm your order details by email shortly.</p>
        <a href="/">Back to Home</a>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var sessionId = params.get('session_id');
            if (sessionId) {
                // Keep for internal tracking only; do not display any codes to the customer.
                try { sessionStorage.setItem('paidStripeCheckoutSessionId', sessionId); } catch (e) {}
            }
            try {
                localStorage.setItem('quoteBasket', '[]');
                localStorage.removeItem('orderNotes');
                sessionStorage.removeItem('pendingStripeQuoteId');
                sessionStorage.removeItem('pendingStripeCheckoutSessionId');
            } catch (e) {}
        })();
    </script>
</body>
</html>
