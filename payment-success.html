    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - BrandedUK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="brandedukv15-child/assets/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --navy: #273469;
            --orange: #f97316;
            --green: #22c55e;
            --border: #e5e7eb;
            --grey: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f5f7;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: var(--navy);
        }
        main {
            width: min(100%, 520px);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            background: var(--green);
            color: #fff;
            font-size: 34px;
            font-weight: 800;
        }
        h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.15; }
        p { margin: 0 auto 18px; color: var(--grey); line-height: 1.6; }
        .session {
            display: none;
            margin: 18px 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            color: var(--grey);
            font-size: 12px;
            word-break: break-all;
        }
        a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 8px;
            background: var(--orange);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .icon.is-pending { background: var(--border); color: var(--navy); }
        .order-facts {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 16px;
            margin: 0 0 22px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            text-align: left;
        }
        .order-facts[hidden] { display: none; }
        .order-facts dt { color: var(--grey); font-size: 14px; }
        .order-facts dd { margin: 0; font-weight: 700; text-align: right; word-break: break-all; }
    </style>
</head>
<body>
    <main aria-live="polite">
        <div class="icon is-pending" id="psIcon" aria-hidden="true">…</div>
        <h1 id="psTitle">Checking your payment…</h1>
        <p id="psText">This only takes a moment.</p>
        <dl class="order-facts" id="psFacts" hidden>
            <dt>Order number</dt><dd id="psOrder"></dd>
            <dt>Total paid</dt><dd id="psTotal"></dd>
        </dl>
        <a href="/">Back to Home</a>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var sessionId = params.get('session_id') || '';
            var pendingOrderNumber = '';
            if (sessionId) {
                try { sessionStorage.setItem('paidStripeCheckoutSessionId', sessionId); } catch (e) {}
            }
            try { pendingOrderNumber = sessionStorage.getItem('pendingCustomerOrderNumber') || ''; } catch (e) {}

            function clearBasket() {
                try {
                    localStorage.setItem('quoteBasket', '[]');
                    localStorage.removeItem('orderNotes');
                    sessionStorage.removeItem('pendingStripeQuoteId');
                    sessionStorage.removeItem('pendingStripeCheckoutSessionId');
                } catch (e) {}
            }

            function show(state, data) {
                var icon = document.getElementById('psIcon');
                var title = document.getElementById('psTitle');
                var text = document.getElementById('psText');
                if (state === 'paid') {
                    icon.textContent = '✓';
                    icon.classList.remove('is-pending');
                    title.textContent = 'Payment Successful';
                    text.textContent = 'Thank you, your payment has been received. We will confirm your order details by email shortly.';
                    var total = Number(data.total);
                    document.getElementById('psOrder').textContent = data.orderNumber || pendingOrderNumber || data.transactionId || '-';
                    document.getElementById('psTotal').textContent = isFinite(total)
                        ? new Intl.NumberFormat('en-GB', { style: 'currency', currency: data.currency || 'GBP' }).format(total)
                        : '-';
                    document.getElementById('psFacts').hidden = false;
                } else if (state === 'unpaid') {
                    icon.textContent = '!';
                    title.textContent = 'Payment not confirmed yet';
                    text.innerHTML = 'We could not confirm this payment. If money has left your account, please contact us at <a href="mailto:info@brandeduk.com" style="all:revert">info@brandeduk.com</a> or 0208 974 2722.';
                } else {
                    icon.textContent = '✓';
                    title.textContent = 'Thank you';
                    text.textContent = 'If your payment went through, you will receive a confirmation email shortly. Questions? Call 0208 974 2722 or email info@brandeduk.com.';
                }
            }

            function verify() {
                if (!/^cs_(test|live)_/.test(sessionId)) {
                    clearBasket();
                    show('unknown');
                    return;
                }
                fetch('/api/orders/verify-payment?session_id=' + encodeURIComponent(sessionId), { cache: 'no-store' })
                    .then(function (res) { return res.json().catch(function () { return {}; }); })
                    .then(function (data) {
                        if (!data || data.verified !== true) {
                            clearBasket();
                            show('unknown');
                            return;
                        }
                        if (!data.paid) {
                            show('unpaid');
                            return;
                        }
                        clearBasket();
                        show('paid', data);
                        if (data.conversionEligible === true && typeof window.brandedAdsPurchase === 'function') {
                            window.brandedAdsPurchase(data);
                        }
                    })
                    .catch(function () {
                        clearBasket();
                        show('unknown');
                    });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', verify);
            else verify();
        })();
    </script>
</body>
</html>
