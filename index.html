    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;

            background: #faf7f3;
            color: #333;
        }
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            contain: layout paint;
        }
        .upload span {
            display: block;
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            box-shadow: 2px 2px 3px rgba(0,0,0,.4);
            -webkit-animation: run 2s infinite ease-in-out;
            animation: run 2s infinite ease-in-out;
        }
        .upload .upload1 { background: #f3b222; animation-delay: 1.5s; }
        .upload .upload2 { background: #f0653e; animation-delay: 1s; }
        .upload .upload3 { background: #b9c0c0; animation-delay: .5s; }
        .upload .upload4 { background: #8f7473; }
        @-webkit-keyframes run {
            0% { transform: translate(0%); border-radius: 50%; }
            25% { transform: translate(150%) scale(.5); border-radius: 0%; }
            50% { transform: translate(150%, 150%); border-radius: 50%; }
            75% { transform: translate(0%, 150%) scale(.5); border-radius: 0%; }
        }
        @keyframes run {
            0% { transform: translate(0%); border-radius: 50%; }
            25% { transform: translate(150%) scale(.5); border-radius: 0%; }
            50% { transform: translate(150%, 150%); border-radius: 50%; }
            75% { transform: translate(0%, 150%) scale(.5); border-radius: 0%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .upload span { animation-duration: 4s; }
        }
        a { color: #273469; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">BrandedUK - Custom Workwear, Uniforms, Embroidery &amp; Printing</h1>
    <div class="loader-container">
        <div class="upload" role="status" aria-label="Loading BrandedUK">
            <span class="upload1"></span>
            <span class="upload2"></span>
            <span class="upload3"></span>
            <span class="upload4"></span>
        </div>
        <p id="debugInfo" style="display:none;"></p>
        <noscript>
            <p>
                <a href="index-mobile.html">Mobile/Tablet</a> | 
                <a href="home-pc.html">Desktop</a>
            </p>
        </noscript>
    </div>

    <script>
        (function () {
            var BREAKPOINT = 1280;
            var lastTarget = null;
            var autoTimer = null;
            var debugInfoEl = document.getElementById('debugInfo');
            var redirected = false;

            function updateDebug(mode) {
                if (!debugInfoEl) return;
                debugInfoEl.textContent = 'width=' + window.innerWidth + ' • dpr=' + (window.devicePixelRatio || 1) + ' • mode=' + mode;
            }

            function getForcedTarget() {
                try {
                    var params = new URLSearchParams(window.location.search);
                    var force = (params.get('force') || '').toLowerCase();
                    if (force === 'mobile') return 'index-mobile.html';
                    if (force === 'desktop') return 'home-pc.html';
                } catch (e) {}
                return null;
            }

            function computeTargetByDevice() {
                var ua = (navigator.userAgent || '').toLowerCase();
                var uaDataMobile = false;
                try {
                    uaDataMobile = !!(navigator.userAgentData && navigator.userAgentData.mobile);
                } catch (e) {
                    uaDataMobile = false;
                }
                var isIPad = ua.indexOf('ipad') !== -1 || (ua.indexOf('macintosh') !== -1 && (navigator.maxTouchPoints || 0) > 1);
                var isIPhone = ua.indexOf('iphone') !== -1 || ua.indexOf('ipod') !== -1;
                var isAndroid = ua.indexOf('android') !== -1;
                var isAndroidTablet = isAndroid && ua.indexOf('mobile') === -1;
                var isTabletUA = isIPad || isAndroidTablet || ua.indexOf('tablet') !== -1 || ua.indexOf('silk') !== -1;
                var isMobileUA = uaDataMobile || isIPhone || /\bmobi\b/.test(ua) || ua.indexOf('iemobile') !== -1 || ua.indexOf('opera mini') !== -1;
                var isViewportMobile = window.matchMedia
                    ? window.matchMedia('(max-width: ' + (BREAKPOINT - 1) + 'px)').matches
                    : (window.innerWidth < BREAKPOINT);
                var shouldUseMobile = isMobileUA || isTabletUA || isViewportMobile;
                return shouldUseMobile ? 'index-mobile.html' : 'home-pc.html';
            }

            function redirectIfNeeded() {
                if (redirected) return;
                var forced = getForcedTarget();
                var target = forced || computeTargetByDevice();
                updateDebug(forced ? ('forced:' + forced) : (target.indexOf('mobile') !== -1 ? 'auto:mobile' : 'auto:desktop'));
                if (target) {
                    redirected = true;
                    lastTarget = target;
                    window.location.replace(target);
                }
            }

            // Redirect after splash screen delay.
            updateDebug('pending');

            var MAX_WAIT_MS = 3000;
            var didRedirect = false;

            function safeRedirect(reason) {
                if (didRedirect) return;
                didRedirect = true;
                updateDebug(reason);
                redirectIfNeeded();
            }

            function startSplashCountdown() {
                if (autoTimer) return;
                autoTimer = setTimeout(function () {
                    safeRedirect('timeout');
                }, MAX_WAIT_MS);
            }

            // Wait for this loader page to be fully ready, then show one full animation cycle.
            if (document.readyState === 'complete') {
                startSplashCountdown();
            } else {
                window.addEventListener('load', startSplashCountdown, { once: true });
            }
        })();
    </script>
</body>
